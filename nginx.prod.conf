server {
    listen 443 ssl;
    server_name demo.goharnawaz.com;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/html/public;

    ssl_certificate     /etc/letsencrypt/live/demo.goharnawaz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.goharnawaz.com/privkey.pem;

    # Sabhi URL requests ko Laravel ke index.php par bhejta hai
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP files ko process karne ke liye PHP-FPM container tak bhejta hai
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000; # 'app' hmare php container ka naam hai
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
