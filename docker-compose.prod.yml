services:
  # 1. PHP-FPM Service (Laravel Container)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - /var/www/html/vendor

  # 2. Nginx Web Server Service (HTTPS only, Let's Encrypt certs mounted from host)
  web:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./src:/var/www/html
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
