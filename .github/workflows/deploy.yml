name: Deploy Laravel App to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Check karein agar project directory exist karti hai
            if [ ! -d "app" ]; then
              git clone https://github.com/${{ github.repository }}.git app
              cd app
            else
              cd app
              # pull ki jagah force-sync: container ke chmod se tracked files ki
              # permission (mode) badal jati hai, jise git "local change" samajh
              # kar merge par atak jata hai. Ye deploy target hai, koi manual
              # edit yahan expect nahi hoti, isliye hamesha origin/main se match.
              git fetch origin main
              git reset --hard origin/main
            fi

            # Docker containers ko rebuild aur restart karein (HTTPS-only prod config)
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build